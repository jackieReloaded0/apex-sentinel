# =============================================================================
# Dependabot Configuration for Apex-Sentinel
# - セキュリティ & 依存関係の保守自動化
# - PR 乱立を防ぐグループ化（Grouping）の採用
# - Docker イメージは破壊的変更を避けるためマイナー・パッチアップデートのみ許可
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # 1. GitHub Actions のワークフロー依存関係 (セキュリティ更新のみ)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 通常の定期バージョン更新 PR を停止し、脆弱性検出時のセキュリティアップデートのみ許可
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # 2. Python (uv / pip) 依存パッケージ (セキュリティ更新のみ)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # 通常の定期バージョン更新 PR を停止し、脆弱性検出時のセキュリティアップデートのみ許可
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # 3. Dockerfile ベースイメージ (マイナー・パッチ更新のみ PR 作成)
  # ※ Dockerfile は Security updates 対象外のため、定期更新でメジャーを除外して運用
  # ※ Python は 3.14 系列に固定するため、マイナー更新 (3.15 等) も除外
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    ignore:
      # 全体: メジャーアップデートを除外
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Python イメージ: 3.14 に固定 (3.15 等のマイナーアップデートを除外)
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
    groups:
      docker-dependencies:
        patterns:
          - "*"
